<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maddiyat — Giriş</title>
    <script>
        // Tema ön-yükleme (FOUC önler)
        (function() {
            var saved = localStorage.getItem("maddiyat_theme");
            if (saved === "dark" || (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <button id="themeToggle" class="theme-toggle" title="Tema değiştir"
            style="position:fixed; top:1rem; right:1rem; z-index:100; background:rgba(255,255,255,0.15); color:#fff; border-color:rgba(255,255,255,0.3); backdrop-filter:blur(8px);">
        🌙
    </button>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-mark">₺</div>
            <h1>Maddiyat</h1>
            <p class="brand-sub">Bütçenizi anlayın, varlığınızı büyütün.</p>
        </div>
        <form id="loginForm" class="login-form" autocomplete="on">
            <label>
                <span>Kullanıcı Adı</span>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                <span>Şifre</span>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </label>
            <div id="errorBox" class="error-msg hidden"></div>
            <button type="submit" class="btn btn-primary">Giriş Yap</button>
            <div class="hint">Demo: <code>admin</code> / <code>admin</code></div>
        </form>
    </div>
    <script>
        // Tema toggle
        (function() {
            var btn = document.getElementById("themeToggle");
            var setIcon = function() { btn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙"; };
            setIcon();
            btn.addEventListener("click", function() {
                var isDark = document.documentElement.classList.toggle("dark");
                localStorage.setItem("maddiyat_theme", isDark ? "dark" : "light");
                setIcon();
            });
        })();
    </script>
    <script>
        // Eğer önceden giriş yaptıysa direkt dashboard'a
        if (sessionStorage.getItem("maddiyat_user")) {
            window.location.href = "dashboard.html";
        }
        const form = document.getElementById("loginForm");
        const errorBox = document.getElementById("errorBox");
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            if (u === "admin" && p === "admin") {
                sessionStorage.setItem("maddiyat_user", u);
                window.location.href = "dashboard.html";
            } else {
                errorBox.textContent = "Geçersiz kullanıcı adı veya şifre.";
                errorBox.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
